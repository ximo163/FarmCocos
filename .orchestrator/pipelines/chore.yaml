# pipeline:chore —— 腳手架、依賴、構建配置這類寫不出失敗測試的改動。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: [client-web, client-smoke]
protected:
  - legacy/
  - spec/
  - checks/
  - scripts/
  - harness/
  - ci/
  - deploy/
  - .github/
  - "*.md"
  - "**/*.meta"
  - "**/*.prefab"
  - "**/*.scene"
  - client/settings/
  - client/types/
  - client/assets/scene/
  - client/*.json
cache: { npm_config_cache: npm }
generated:
  paths: ["client/assets/scripts/shared/"]
  how: "改 packages/<包>/src 下的源文件，然後運行 node scripts/sync-shared.mjs"
  cmd: "node scripts/sync-shared.mjs"
suites:
  typecheck: { cmd: "npm ci --no-audit --no-fund --silent && npm run -s typecheck", timeout: 10m }
  test: { cmd: "npm ci --no-audit --no-fund --silent && npm run -s test", timeout: 15m }
  purity: { cmd: "bash checks/core-purity.sh", timeout: 2m }
preflight: [typecheck, test]
budget: { max_runs: 15, max_time: 4h }
stages:
  - id: implement
    kind: agent
    model: strong
    prompt: prompts/chore.md
    max_turns: 160
    timeout: 60m
    verify: [typecheck, purity, test]
    ci: true
    attempts: 4
    escalate: { after: 2, models: [strong2] }
  - id: review
    kind: review
    model: judge
    prompt: prompts/review-chore.md
    max_turns: 100
    on_reject: implement
    max_rejects: 4
    escalate: { after: 2, models: [judge2] }
  - id: merge
    kind: merge
    method: squash
    exclude_from_limits: ["package-lock.json"]
    max_changed_lines: 1000
    max_changed_files: 30
    require_distinct_reviewer: true
    allowed_paths:
      - packages/
      - server/
      - tools/
      - client/assets/scripts/
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
