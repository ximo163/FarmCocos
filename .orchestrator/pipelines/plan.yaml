# pipeline:plan —— 大需求先拆成子 issue。triage 認為太大的任務也會被轉到這裡。
# confirm: true：計劃先貼在 issue 上，人回覆 /agent approve 才創建子 issue。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
stages:
  - id: plan
    kind: plan
    model: strong
    prompt: prompts/plan.md
    max_turns: 120
    timeout: 45m
    max_issues: 8
    ready_label: agent:ready
    allowed_labels: []
    confirm: true
