# pipeline:plan —— 大需求先拆成子 issue。triage 認為太大的任務也會被轉到這裡。
# 無人值守：計劃直接創建子 issue 並打上 agent:ready，watch 按依賴順序逐個啟動。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
stages:
  - id: plan
    kind: plan
    model: strong
    prompt: prompts/plan.md
    max_turns: 120
    timeout: 45m
    max_issues: 8
    ready_label: agent:ready
    allowed_labels: []
    confirm: false
