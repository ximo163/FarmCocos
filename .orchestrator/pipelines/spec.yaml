# pipeline:spec —— 從 legacy/ 提取規格到 spec/（協議、作物數據、時間軸清單、交互清單）。
# 只能改 spec/，結果由人審核後合併；合併後的 spec/ 在其他流水線裡是只讀的驗收標準。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: []
protected: [legacy/, checks/, scripts/legacy/, .github/, "*.md"]
cache: { npm_config_cache: npm }
suites:
  spec: { cmd: "bash checks/spec-valid.sh", timeout: 2m }
  manifest: { cmd: "bash checks/manifest-valid.sh", timeout: 2m }
preflight: [manifest]
budget: { max_runs: 12, max_time: 4h }
stages:
  - id: extract
    kind: agent
    model: strong
    prompt: prompts/spec.md
    max_turns: 200
    timeout: 60m
    allowed_paths: ["spec/"]
    verify: [spec]
    ci: local
    attempts: 3
    escalate: { after: 2, models: [strong2] }
  - id: review-spec
    kind: review
    model: judge
    prompt: prompts/review-spec.md
    max_turns: 120
    on_reject: extract
    max_rejects: 4
    escalate: { after: 2, models: [judge2] }
